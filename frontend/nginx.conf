server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API and WhatsApp short links go to the backend container. On the
    # server the host nginx (deploy/nginx-site.conf) routes these first; this
    # makes `docker compose up` work on its own at http://localhost:3000.
    client_max_body_size 60M;
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /r/ {
        proxy_pass http://backend:8001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
